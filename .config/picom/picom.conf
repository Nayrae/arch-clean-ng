# picom config (successor of compton; Arch only ships picom).
# Uses the picom >= 12 "rules" syntax.

# Shadow
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.7;

# Fading
fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.04;

# Other
backend = "xrender";
vsync = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = false;

# Per-window rules (replaces no-dock-shadow, no-dnd-shadow, wintypes and opacity-rule)
rules = (
  { match = "window_type = 'dock' || window_type = 'dnd'"; shadow = false; },
  { match = "window_type = 'tooltip'"; fade = true; shadow = true; opacity = 0.75; },
  { match = "class_g = 'Alacritty'"; opacity = 0.85; },
  { match = "class_g = 'Code'"; opacity = 0.90; },
  { match = "class_g = 'Sublime_text'"; opacity = 0.90; },
);
